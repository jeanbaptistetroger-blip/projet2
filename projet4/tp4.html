<!DOCTYPE html>
<html>
<head>
	<title>Inscription</title>
</head>
<body bgcolor="grey">

	<header>

	   <h1 align="center">Inscription d'un nouveau client</h1>

	</header>

<section>

	<form>

		<table border="1" width="50%" align="center">
			
			<tr> 
                <td>
                    <label> Nom</label>
                </td>

				<td>

                    <input type="text" name="Nom">
                </td>

            </tr>

			<tr>
                <td>
                    <label>Date de naissance</label>
                </td>
				<td>
                    <input type="Date" name="Date naissance">
                </td>
            </tr>
			<tr>
                <td>
                    <label>Age</label>
                </td>
				<td>
                    <input type="Number" name="n1">
                </td>
                <br>
			<tr>
                <td>
                    <label>email</label>
                </td>
				<td>
                    <input type="email" name="email" placeholder="Tapez votre email">
                </td>
            </tr>
		

			<tr>
                <td>
                    <label>Mot de passe</label></td>
				<td>
                    <input type="password" name="mdp">
                </td>
            </tr>
			<tr>
                <td>
                    <label>Numéro de permis</label>
                </td>
				<td>
                    <input type="text" name="permis">
                </td>
            </tr>
			<tr>
                <td>
                    <label>Ancienneté</label>
                </td>
				<td>
                    <input type="Number" name="anciennete" min="0" max="80">
                </td>
            </tr>
			<tr>
                <td>
                    <label>Ville</label>
                </td>
                <td>
                    <select>
					   <option>Paris</option>
					   <option>Nantes</option>
					   <option>Orléans</option>
					   <option>Versailles</option>
					   <option>Créteil</option>
					   <option>Rouen</option>
					</select>
                </td>
            </tr>
			<tr>
                <td>
                    <label>Adresse du Client</label>
                </td>
				<td>
                    <textarea id="adresse" name="adresse" rows="4" cols="30"></textarea>
                </td>
            </tr>

			<tr>
                <td>
                    <label>Spécialité</label>
                </td>
			     <td>
                    SISR<input type="radio" name="sisr">
                    SLAM<input type="radio" name="slam">
                </td>
            </tr>

			<tr>
                <td>
                    <label>Hobbies</label></td>
				<td>
                    Lecture <input type="checkbox" name="lecture">
				    Sport <input type="checkbox" name="sport">
				    Musique<input type="checkbox" name="musique">
                </td>
            </tr>
			<tr>
                <td>
                    <p>Situation matrimoniale</p>
                </td>
			<td><label>Marié</label>
				<input type="radio" name="marié" value="oui">
			<label>non marié</label>
				<input type="radio" name="marié" value="non">
            </td>
        </tr>

		<tr>
            <td>
                <p>Préférence de voiture</p></td>
			
                <td>
                    <label>Automatique</label>
				<input type="checkbox" name="preference_auto" value="automatique">
			<label>Manuelle</label>
				<input type="checkbox" name="preference_manuelle" value="manuelle">
            </td>
        </tr>
				

				<tr>
                    <td>
                        <input type="submit" name="" value="Valider">
				<input type="reset" name="" value="Annuler">
            </td>
        </tr>
		</form>
    </table>
	</section>
<footer>
	<p>mention de l'agence</p>
</footer>

</body>

</html>
