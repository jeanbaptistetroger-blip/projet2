	<H1>Métiers de la RATP</H1>
	<p>La Régie autonome des transports parisiens (RATP) est un établissement public de l'État français créé en 1949. C’est l'acteur historique majeur des transports en commun de Paris et de sa proche banlieue (Île-de-France).</p>
