<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>TP - 5 boutons JavaScript</title>
    <link rel="stylesheet" href="ex1.css" />
    <script src="ex1.js"></script>
  </head>
  <body>
    <h1>Ma page interactive</h1>
    <div class="boutons">
      <button id="btn1" onclick="direBonjour()">Dire bonjour</button>

      <p id="message">Cliquez sur un bouton.</p>
    </div>
  </body>
